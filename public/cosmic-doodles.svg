<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <!-- 4-point sparkle stars -->
    <g id="star-yellow-lg">
      <path d="M20 0 C20 13, 27 20, 40 20 C27 20, 20 27, 20 40 C20 27, 13 20, 0 20 C13 20, 20 13, 20 0 Z" fill="#FBBF24" opacity="0.95"/>
    </g>
    <g id="star-yellow-sm">
      <path d="M10 0 C10 6.5, 13.5 10, 20 10 C13.5 10, 10 13.5, 10 20 C10 13.5, 6.5 10, 0 10 C6.5 10, 10 6.5, 10 0 Z" fill="#FBBF24" opacity="0.9"/>
    </g>
    <g id="star-purple-lg">
      <path d="M20 0 C20 13, 27 20, 40 20 C27 20, 20 27, 20 40 C20 27, 13 20, 0 20 C13 20, 20 13, 20 0 Z" fill="#818CF8" opacity="0.95"/>
    </g>
    <g id="star-purple-sm">
      <path d="M10 0 C10 6.5, 13.5 10, 20 10 C13.5 10, 10 13.5, 10 20 C10 13.5, 6.5 10, 0 10 C6.5 10, 10 6.5, 10 0 Z" fill="#818CF8" opacity="0.9"/>
    </g>
    <g id="star-pink-sm">
      <path d="M10 0 C10 6.5, 13.5 10, 20 10 C13.5 10, 10 13.5, 10 20 C10 13.5, 6.5 10, 0 10 C6.5 10, 10 6.5, 10 0 Z" fill="#F472B6" opacity="0.9"/>
    </g>
    <g id="star-blue-sm">
      <path d="M10 0 C10 6.5, 13.5 10, 20 10 C13.5 10, 10 13.5, 10 20 C10 13.5, 6.5 10, 0 10 C6.5 10, 10 6.5, 10 0 Z" fill="#38BDF8" opacity="0.9"/>
    </g>

    <!-- Ringed Planets -->
    <g id="planet-purple">
      <circle cx="20" cy="20" r="10" fill="#A78BFA" opacity="0.9"/>
      <ellipse cx="20" cy="20" rx="19" ry="6" fill="none" stroke="#818CF8" stroke-width="2.5" transform="rotate(-25 20 20)" opacity="0.95"/>
    </g>

    <g id="planet-pink">
      <circle cx="16" cy="16" r="8" fill="#F472B6" opacity="0.9"/>
      <ellipse cx="16" cy="16" rx="15" ry="5.5" fill="none" stroke="#FB7185" stroke-width="2" transform="rotate(-25 16 16)" opacity="0.95"/>
    </g>

    <!-- Cross Sparkles -->
    <g id="cross-purple">
      <path d="M6 0 L6 12 M0 6 L12 6" stroke="#818CF8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g id="cross-pink">
      <path d="M6 0 L6 12 M0 6 L12 6" stroke="#FB7185" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g id="cross-yellow">
      <path d="M6 0 L6 12 M0 6 L12 6" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>
    <g id="cross-blue">
      <path d="M6 0 L6 12 M0 6 L12 6" stroke="#38BDF8" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
    </g>
  </defs>

  <!-- Shooting Star Swoosh Trails -->
  <path d="M30 180 Q 70 120, 150 90" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M40 188 Q 75 132, 142 104" fill="none" stroke="#DDD6FE" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <path d="M350 420 Q 420 370, 470 330" fill="none" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M360 428 Q 425 382, 465 344" fill="none" stroke="#DDD6FE" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <path d="M420 80 Q 450 30, 490 20" fill="none" stroke="#FDE047" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

  <!-- Stars Placement -->
  <use href="#star-yellow-lg" x="220" y="40" transform="rotate(10 240 60)"/>
  <use href="#star-yellow-sm" x="60" y="260" transform="rotate(-15 70 270)"/>
  <use href="#star-yellow-lg" x="410" y="220" transform="rotate(8 430 240)"/>
  <use href="#star-yellow-sm" x="180" y="380" transform="rotate(-10 190 390)"/>
  <use href="#star-yellow-sm" x="320" y="160" transform="rotate(15 330 170)"/>

  <use href="#star-purple-lg" x="40" y="50" transform="rotate(-12 60 70)"/>
  <use href="#star-purple-sm" x="290" y="280" transform="rotate(12 300 290)"/>
  <use href="#star-purple-lg" x="110" y="430" transform="rotate(5 130 450)"/>
  <use href="#star-purple-sm" x="440" y="450" transform="rotate(-8 450 460)"/>
  <use href="#star-purple-sm" x="170" y="180" transform="rotate(10 180 190)"/>

  <use href="#star-pink-sm" x="130" y="310" transform="rotate(15 140 320)"/>
  <use href="#star-pink-sm" x="380" y="60" transform="rotate(-10 390 70)"/>
  <use href="#star-pink-sm" x="260" y="460" transform="rotate(20 270 470)"/>
  <use href="#star-pink-sm" x="470" y="150" transform="rotate(5 480 160)"/>

  <use href="#star-blue-sm" x="80" y="130" transform="rotate(-15 90 140)"/>
  <use href="#star-blue-sm" x="340" y="360" transform="rotate(12 350 370)"/>

  <!-- Planets Placement -->
  <use href="#planet-purple" x="430" y="370"/>
  <use href="#planet-pink" x="15" y="360"/>
  <use href="#planet-purple" x="240" y="210" transform="scale(0.8)"/>

  <!-- Crosses Placement -->
  <use href="#cross-purple" x="110" y="40"/>
  <use href="#cross-purple" x="380" y="190"/>
  <use href="#cross-purple" x="40" y="470"/>
  <use href="#cross-pink" x="290" y="80"/>
  <use href="#cross-pink" x="200" y="270"/>
  <use href="#cross-pink" x="460" y="290"/>
  <use href="#cross-yellow" x="170" y="120"/>
  <use href="#cross-yellow" x="30" y="210"/>
  <use href="#cross-yellow" x="390" y="480"/>
  <use href="#cross-blue" x="220" y="340"/>
  <use href="#cross-blue" x="480" y="40"/>

  <!-- Soft Pastel Floating Dots -->
  <circle cx="140" cy="80" r="3.5" fill="#FBBF24" opacity="0.8"/>
  <circle cx="320" cy="50" r="4" fill="#A78BFA" opacity="0.8"/>
  <circle cx="70" cy="390" r="3" fill="#F472B6" opacity="0.8"/>
  <circle cx="270" cy="150" r="3.5" fill="#818CF8" opacity="0.8"/>
  <circle cx="420" cy="130" r="4" fill="#FBBF24" opacity="0.8"/>
  <circle cx="370" cy="310" r="3" fill="#A78BFA" opacity="0.8"/>
  <circle cx="190" cy="470" r="4" fill="#F472B6" opacity="0.8"/>
</svg>
